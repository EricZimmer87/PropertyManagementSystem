<div>
  <h2 class="text-center">Login</h2>

  <div class="d-flex justify-content-center">
    <form class="w-100" style="max-width: 320px" [formGroup]="loginForm" (submit)="submitLogin()">
      @if (errorMessage()) {
        <p class="text-danger">
          {{ errorMessage() }}
        </p>
      }

      <label class="form-label" for="email">Email:</label>
      <input
        class="form-control"
        type="text"
        id="email"
        name="email"
        formControlName="email"
        required
      />

      <label class="form-label" for="password">Password:</label>
      <input
        class="form-control"
        type="password"
        id="password"
        name="password"
        formControlName="password"
        required
      />

      <button class="btn btn-primary mt-3" type="submit" [disabled]="loginForm.invalid">
        Login
      </button>
    </form>
  </div>

  <div class="text-center mt-5">
    <button class="btn btn-primary" (click)="googleLoginSubmit()" id="google-login-button">
      Login with Google
    </button>
  </div>
</div>
