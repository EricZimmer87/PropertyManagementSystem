<div>
  <h2 class="form-header">Login</h2>

  <form [formGroup]="loginForm" (submit)="submitLogin()">
    @if (errorMessage()) {
      <p class="error-message">
        {{ errorMessage() }}
      </p>
    }

    <label for="email">Email:</label>
    <input type="text" id="email" name="email" formControlName="email" required />

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" formControlName="password" required />

    <button class="submit-button" type="submit" [disabled]="loginForm.invalid">Login</button>
  </form>

  <button class="btn btn-primary" (click)="googleLoginSubmit()" id="google-login-button">
    Login with Google
  </button>
</div>
