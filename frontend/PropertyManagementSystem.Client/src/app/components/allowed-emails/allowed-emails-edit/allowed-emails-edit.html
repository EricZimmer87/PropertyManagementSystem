<h1>Edit Allowed Email</h1>

<form
  class="w-100"
  style="max-width: 320px"
  [formGroup]="editAllowedEmailForm"
  (submit)="onSubmit()"
>
  <label class="form-label" for="email">Email:</label>

  <input
    class="form-control"
    id="email"
    type="email"
    formControlName="email"
    required
  />

  <button
    class="btn btn-primary mt-3"
    type="submit"
    [disabled]="editAllowedEmailForm.invalid"
  >
    Submit
  </button>
</form>
