<h1>Edit Allowed Email</h1>

<form
  class="w-100"
  style="max-width: 320px"
  (submit)="onSubmit($event)"
>
  <label class="form-label" for="email">Email:</label>

  <input
    class="form-control"
    id="email"
    type="email"
    [formField]="allowedEmailEditForm.email"
  />

  <button
    class="btn btn-primary mt-3"
    type="submit">
    Submit
  </button>
</form>
