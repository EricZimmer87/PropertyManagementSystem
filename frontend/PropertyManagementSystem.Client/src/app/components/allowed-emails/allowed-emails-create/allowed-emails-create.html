<h1>Add Allowed Email</h1>

<form class="w-100" style="max-width: 320px" [formRoot]="allowedEmailCreateForm">
  <label for="email" class="form-label">Email: </label>

  <input type="email" class="form-control" id="email" [formField]="allowedEmailCreateForm.email">

  @if (allowedEmailCreateForm.email().errors().length > 0) {
    @for (error of allowedEmailCreateForm.email().errors(); track error) {
      <div class="error">{{ error.message }}</div>
    }
  }

  <button
    class="btn btn-primary mt-3"
    type="submit"
    [disabled]="allowedEmailCreateForm().submitting()">
    Submit
  </button>

</form>
